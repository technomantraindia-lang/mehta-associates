<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | Mehta Associates</title>
  <meta name="robots" content="noindex, follow">
  
  <link rel="icon" type="image/png" href="assets/images/extracted_2.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <header class="header">
    <div class="container header-inner">
      <div class="header-brand-group">
        <a href="index.html" class="brand-logo-wrap" title="Mehta Associates - Home">
          <img src="assets/images/logo.png" alt="Mehta Associates" class="brand-logo" width="250" height="50">
        </a>
      </div>
      <a href="index.html" class="btn btn-secondary btn-sm">
        <span>Return to Homepage</span>
      </a>
    </div>
  </header>

  <main style="padding: 6rem 1.5rem; text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="max-width: 580px; margin: 0 auto;">
      <span class="eyebrow">404 Error</span>
      <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem; color: var(--color-primary);">
        Page Not Found
      </h1>
      <p class="text-lead" style="margin-bottom: 2rem;">
        The requested page could not be located. It may have been moved or updated during our website redesign.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-primary btn-lg">
          <i data-lucide="home" style="width: 18px; height: 18px;"></i>
          <span>Go to Homepage</span>
        </a>
        <a href="products.html" class="btn btn-secondary btn-lg">
          <i data-lucide="package" style="width: 18px; height: 18px;"></i>
          <span>View Product Catalogue</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer" style="padding-top: 2rem; padding-bottom: 2rem;">
    <div class="container" style="text-align: center; font-size: 0.8125rem; color: rgba(255, 255, 255, 0.6);">
      &copy; 1985 &ndash; 2026 Mehta Associates. All Rights Reserved. Mumbai, India.
    </div>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
